<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Support Copilot Grand Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600;700&display=swap">
<script src="/static/vendor/tailwind.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { sky: "var(--sky)", ink: "var(--text)", mute: "var(--muted)", warnt: "var(--warn)", dangert: "var(--danger)" },
        fontFamily: {
          display: ['"Onest"', "system-ui", "sans-serif"],
          sans: ['"Onest"', "system-ui", "sans-serif"],
          code: ['"JetBrains Mono"', "Consolas", "monospace"],
        },
      },
    },
  };
</script>
<style>
  /* Спокойный пульт Grand Mobile: острые углы, одно обращение по центру, очередь круглыми метками, остальное по запросу.
     Жёлтый логотипа только у главного действия и активного тикета, цвета приоритетов приглушены. */
  :root {
    color-scheme: dark;
    --header: #080807; --sky: #111214; --paper: #1A1C1F; --raised: #25282C; --line: #3A3E44;
    --text: #F2F3F5; --muted: #A6ACB5; --accent: #E0B414; --on-accent: #111214;
    --p0: #FF7A66; --p1: #F5A53A; --p2: #C9B8F0; --p3: #7DB7F0;
    --ok: #5FCF9A; --warn: #E8B04A; --danger: #FF7A66;
  }
  html, body { height: 100%; }
  body { background: var(--sky); color: var(--text); font-family: "Onest", system-ui, sans-serif; font-size: 16px; line-height: 1.6; }
  #root { height: 100%; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .num { font-variant-numeric: tabular-nums; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 28px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .btn { min-height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 26px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; background: var(--paper); transition: background-color 120ms, transform 80ms; }
  .btn:hover { background: var(--raised); }
  .btn:active { transform: translateY(1px); }
  .btn-main { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn-main:hover { background: #EFC63A; }
  .btn-danger { color: var(--danger); }
  .key { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 7px; border-radius: 2px; border: 1px solid currentColor; }

  .badge { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 2px; color: var(--on-accent); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; max-width: 100%; }
  .pill-final { background: var(--raised); color: var(--accent); font-weight: 700; }
  .pill-low { color: var(--warn); font-weight: 700; }

  .sticker { width: 52px; height: 52px; flex: none; display: grid; place-items: center; border-radius: 999px; color: var(--on-accent); font-size: 15px; font-weight: 700; transition: transform 120ms; }
  .sticker:hover { transform: scale(1.06); }
  .sticker[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: 3px; }

  .flow { list-style: none; margin: 0; padding-top: 10px; padding-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--paper); }
  .flow li { display: flex; align-items: center; gap: 8px; }
  .flow-n { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 700; }
  .try-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; }
  .tab { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 2px; border: 1px solid transparent; text-align: left; font-size: 14px; font-weight: 600; line-height: 1.25; }
  .tab:hover { background: var(--raised); }
  .tab[aria-current="true"] { border-color: var(--accent); }
  .count { flex: none; min-width: 34px; height: 34px; padding: 0 8px; display: grid; place-items: center; border-radius: 999px; color: var(--on-accent); font-size: 15px; font-weight: 700; }
  .card-row { background: var(--paper); border: 1px solid var(--line); }
  .row { width: 100%; text-align: left; min-height: 64px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; border-radius: 2px; border: 1px solid transparent; }
  .row:hover { background: var(--raised); }
  .row[aria-current="true"] { border-color: var(--line); }

  .chip { min-height: 48px; padding: 0 18px; display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; transition: background-color 100ms; }
  .chip:hover { background: var(--raised); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .bar { height: 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width 280ms ease-out; }

  .ticket { grid-template-columns: minmax(0, 1fr); width: 100%; }
  .rail { scrollbar-width: none; }
  @media (hover: none) { .player-card { display: none; } }
  .enter { animation: enter 160ms ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .nudge { animation: nudge 240ms ease-out; }
  @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  textarea.draft { width: 100%; resize: none; overflow: hidden; background: transparent; color: var(--text); padding: 0; border: 0; font-size: 19px; line-height: 1.6; }
  .draft-card.editing { border-color: var(--accent); }

  @media (min-width: 760px) {
    .app { height: 100%; }
    .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; flex: 1; }
    .rail { overflow-y: auto; min-height: 0; flex-direction: column; }
    .main { overflow-y: auto; min-height: 0; }
    .drawer { left: 200px; width: 380px; }
  }
  @media (max-width: 759px) {
    .rail { overflow-x: auto; }
    .tab { width: auto; flex: none; }
    .card { padding: 20px; }
    .drawer { left: 0; width: 100%; }
    .hide-phone { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="root"></div>

<script src="/static/vendor/react.js"></script>
<script src="/static/vendor/react-dom.js"></script>
<script src="/static/vendor/htm.js"></script>
<script>window.react = window.React;</script>
<script src="/static/vendor/lucide-react.js"></script>
<script>
const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);
const { Send, Pencil, ArrowUpRight, Check, ShieldCheck, Languages, UserRound, Combine, Undo2, ChevronDown, Bot, Paperclip, TriangleAlert, Menu, X, Sparkles } = LucideReact;

/* Живые данные: очередь и правила приходят из API сервиса (GET /api/queue), здесь нет вшитых обращений. */
let TICKETS = [], AUTO = [], AUTO_TOTAL = 0, TOTAL_P0 = 0;
const RULES = {};
const SLOT = { ru: "[наказание]", kk: "[жаза]", uz: "[jazo]" };
const PUNISH_WORD = { ru: "Наказание", kk: "Жаза", uz: "Jazo" };
const VERDICTS = [
  { id: "approved", label: "Одобрить" },
  { id: "need_evidence", label: "Нужны доказательства" },
  { id: "rejected", label: "Нарушения нет" },
  { id: "invalid_format", label: "Оформлена неверно" },
  { id: "duplicate", label: "Дубликат" },
];

const postJson = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

/* Действие админа и правка черновика — обучающий сигнал, пишется в feedback.jsonl. */
function log(t, action) {
  postJson("/api/feedback", { ticket_id: String(t.id), action, draft_before: t.original || "", draft_after: t.draft || "", category: t.cat || "", priority: "p" + t.p }).catch(() => {});
}

function toTicket(x) {
  const tr = x.triage, nick = tr.extracted.nickname;
  const word = PUNISH_WORD[tr.lang] || PUNISH_WORD.ru;
  const rule = x.rules[0];
  x.rules.forEach((r) => { RULES[r.ref] = { title: r.section, text: r.text, ladder: r.punishments }; });
  const groups = {};
  (rule ? rule.punishments : []).forEach((line) => {
    const cut = line.indexOf(":");
    const group = cut > 0 ? line.slice(0, cut).trim() : "Наказание";
    const value = cut > 0 ? line.slice(cut + 1).trim() : line;
    (groups[group] = groups[group] || []).push({ label: value, ins: value, insRu: value });
  });
  const chips = Object.entries(groups).map(([group, items]) => ({ group, items }));
  const proofs = x.images ? `Вложений: ${x.images}` : (tr.extracted.has_evidence ? "Есть ссылка" : "Нет");
  return {
    id: x.id, p: Number(tr.priority.slice(1)), from: nick || `Обращение ${x.id}`, server: x.region ? x.region.toUpperCase() : (x.kind === "complaint" ? "жалоба" : "репорт"),
    lang: tr.lang, cat: tr.category, conf: tr.confidence, kind: x.kind,
    text: x.messages.map((m) => (m.role === "reported_player" ? "Обвиняемый: " : "") + m.text).join("\n"),
    facts: { nick, refs: tr.extracted.rule_refs.join(", ") || "нет", proof: proofs },
    ref: rule ? rule.ref : null, chips: chips.length ? chips : null,
    draft: tr.draft_reply.text, original: tr.draft_reply.text, human: tr.reasons,
    series: x.series > 1 ? nick : null, profiles: x.profiles || {},
  };
}

async function loadQueue() {
  const data = await fetch("/api/queue").then((r) => r.json());
  const all = data.items.map((x) => ({ x, t: toTicket(x) }));
  TICKETS = all.filter((a) => !a.x.auto).map((a) => a.t);
  AUTO = all.filter((a) => a.x.auto).map(({ t }) => ({ id: t.id, text: t.text, lang: t.lang, reply: t.draft, ticket: t }));
  AUTO_TOTAL = AUTO.length;
  TOTAL_P0 = TICKETS.filter((t) => t.p === 0).length;
}


const TRY_VIEW = "__try";
const TYPE_NAMES = {
  "complaint.insult": "Оскорбления", "complaint.cheat": "Читы", "complaint.dm": "Убийство без повода", "complaint.scam": "Обман",
  "complaint.rmt_ads": "Реклама и продажа", "complaint.admin": "Апелляции и админы", "complaint.other": "Другие жалобы", "complaint.invalid": "Неоформленные",
  "report.question": "Вопросы", "report.help": "Помощь", "report.complaint": "Жалобы из игры", "report.account": "Аккаунт и взлом",
  "report.payment": "Платежи", "report.offtopic": "Оффтоп",
};
/* Типы обращений: срочные сверху, внутри уровня — где обращений больше. */
function groupsOf(tickets) {
  const map = new Map();
  tickets.forEach((t) => {
    const g = map.get(t.cat) || { cat: t.cat, name: TYPE_NAMES[t.cat] || t.cat, p: t.p, items: [] };
    g.p = Math.min(g.p, t.p); g.items.push(t); map.set(t.cat, g);
  });
  return [...map.values()].sort((a, b) => a.p - b.p || b.items.length - a.items.length);
}

const P = [
  { name: "Критично", color: "var(--p0)" },
  { name: "Срочно", color: "var(--p1)" },
  { name: "Обычно", color: "var(--p2)" },
  { name: "Вопрос", color: "var(--p3)" },
];
const LANG = { ru: "RU", kk: "KK", uz: "UZ", en: "EN", es: "ES", pt: "PT", und: "?" };
const LOW_CONF = 0.7;
const initials = (nick) => nick.split("_").map((w) => w[0]).join("");

const Badge = ({ p }) => html`<span class="badge" style=${{ background: P[p].color }}>P${p} · ${P[p].name}</span>`;
const Bar = ({ value, total }) => html`<div class="bar"><i style=${{ width: (total ? (value / total) * 100 : 0) + "%" }}></i></div>`;

/* Положите файл design/logo.png: он заменит текстовое название. */
function Logo() {
  const [failed, setFailed] = useState(false);
  if (failed) return html`<span class="font-display text-[20px] font-bold leading-none">Grand Mobile</span>`;
  return html`<img src="logo.png" alt="Grand Mobile" class="h-11 w-auto mix-blend-lighten" onError=${() => setFailed(true)} />`;
}

function Header({ s, onMenu }) {
  const closed = s.sent + s.escalated;
  return html`<header class="gutter bg-[var(--header)] border-b border-[var(--line)] py-4 flex flex-wrap items-center gap-x-6 gap-y-2">
    <${Logo} />
    <p class="flex-1 min-w-[240px] text-[15px]"><b>Support Copilot.</b> ИИ сортирует обращения и готовит ответ по правилам, решение всегда за админом.</p>
    <div class="flex items-center gap-3">
      <span class="num font-semibold text-[15px]">${closed} из ${TICKETS.length}</span>
      <div class="w-[120px]"><${Bar} value=${closed} total=${TICKETS.length} /></div>
    </div>
  </header>`;
}

/* Как это работает: шаги задачи видны сразу, без инструкции. */
function Flow() {
  const steps = ["Игрок пишет обращение", "Сервис определяет язык, категорию и приоритет", "ИИ готовит черновик со ссылкой на правила", "Решает администратор"];
  return html`<ol class="flow gutter" aria-label="Как это работает">
    ${steps.map((t, i) => html`<li key=${i}><span class="flow-n">${i + 1}</span>${t}</li>`)}
  </ol>`;
}

/* Своё обращение: тот же POST /triage, что подключит игра, ответ по полям из ТЗ. */
function TryView({ onBack }) {
  const [text, setText] = useState("Arman_Petrov оскорблял меня и мою семью в чате, скрин есть, 2.1 ОП");
  const [kind, setKind] = useState("complaint");
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const [failed, setFailed] = useState(false);
  const run = async () => {
    setBusy(true); setFailed(false);
    try {
      const r = await postJson("/triage", { kind, messages: [{ role: "player", text, attachments: kind === "complaint" ? 1 : 0 }] });
      setRes(await r.json());
    } catch (e) { setFailed(true); } finally { setBusy(false); }
  };
  const f = res && res.extracted;
  const rows = res ? [
    ["Язык", LANG[res.lang] || res.lang],
    ["Категория", (TYPE_NAMES[res.category] || "") + " · " + res.category],
    ["Приоритет", res.priority.toUpperCase() + " · " + P[Number(res.priority[1])].name],
    ["Спам или дубль", res.is_spam_or_duplicate ? "да" : "нет"],
    ["Ник", f.nickname || "не найден"],
    ["Пункты правил", (res.draft_reply.cited.join(", ")) || "не нужны"],
    ["Доказательства", f.has_evidence ? "есть" : "нет"],
    ["Нужен человек", res.needs_human ? "да: " + res.reasons.join("; ") : "нет, можно отправлять"],
    ["Уверенность", String(res.confidence).replace(".", ",")],
  ] : [];
  return html`<div class="enter gutter max-w-[880px] mx-auto py-8 grid gap-5">
    <div class="flex flex-wrap items-center gap-3">
      <button type="button" class="chip" onClick=${onBack}><${X} size=${16} /> Закрыть <span class="key">Esc</span></button>
      <h2 class="font-display text-[30px] font-bold leading-tight">Проверить своё обращение</h2>
    </div>
    <section class="card grid gap-3">
      <label for="tryText" class="label">Текст обращения на любом языке игры</label>
      <textarea id="tryText" class="draft" rows="3" value=${text} onChange=${(e) => setText(e.target.value)}></textarea>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="chip" aria-pressed=${kind === "complaint"} onClick=${() => setKind("complaint")}>Жалоба</button>
        <button type="button" class="chip" aria-pressed=${kind === "report"} onClick=${() => setKind("report")}>Репорт</button>
        <button type="button" class="btn btn-main ml-auto" disabled=${busy || !text.trim()} onClick=${run}><${Sparkles} size=${18} /> ${busy ? "Обрабатываю…" : "Обработать"}</button>
      </div>
    </section>
    ${failed && html`<p class="text-dangert">Сервис не ответил, попробуйте ещё раз.</p>`}
    ${res && html`<section class="card grid gap-2" aria-label="Ответ сервиса">
      <h3 class="label">Ответ сервиса</h3>
      <dl class="grid gap-1">${rows.map(([k, v]) => html`<div key=${k} class="try-row"><dt class="text-mute">${k}</dt><dd>${v}</dd></div>`)}</dl>
    </section>
    <section class="card"><h3 class="label mb-2">Черновик ответа игроку, ${LANG[res.draft_reply.lang] || res.draft_reply.lang}</h3>
      <p class="text-[19px] whitespace-pre-line">${res.draft_reply.text}</p></section>`}
  </div>`;
}

function Rail({ s, activeId, openGroup, onGroup, onMenu }) {
  const active = s.tickets.find((t) => t.id === activeId);
  return html`<nav aria-label="Типы обращений" class="rail flex gap-2 bg-[var(--paper)] border-r border-[var(--line)] p-3">
    <button type="button" class="tab" onClick=${onMenu} aria-label="Открыть очередь и цели" title="Очередь и цели (Q)"><${Menu} size=${18} /><span>Вся очередь</span></button>
    <button type="button" class="tab" onClick=${() => onGroup(TRY_VIEW)} aria-current=${openGroup === TRY_VIEW}><${Sparkles} size=${18} /><span>Проверить своё</span></button>
    ${groupsOf(s.tickets).map((g) => html`<button key=${g.cat} type="button" class="tab" onClick=${() => onGroup(g.cat)}
        aria-current=${openGroup === g.cat || (!openGroup && active && active.cat === g.cat)} aria-label=${g.name + ", обращений: " + g.items.length}>
      <span class="count" style=${{ background: P[g.p].color }}>${g.items.length}</span>
      <span>${g.name}</span>
    </button>`)}
  </nav>`;
}

/* Весь экран одного типа: все обращения списком, клик открывает обращение. */
function GroupView({ g, onPick, onBack }) {
  return html`<div class="enter gutter max-w-[880px] mx-auto py-8 grid gap-4">
    <div class="flex flex-wrap items-center gap-3">
      <button type="button" class="chip" onClick=${onBack}><${X} size=${16} /> Закрыть <span class="key">Esc</span></button>
      <h2 class="font-display text-[30px] font-bold leading-tight">${g.name}</h2>
      <span class="badge" style=${{ background: P[g.p].color }}>${g.items.length}</span>
    </div>
    <div class="grid gap-2">
      ${g.items.map((t) => html`<button key=${t.id} type="button" class="row card-row" onClick=${() => onPick(t.id)}>
        <span class="badge flex-none" style=${{ background: P[t.p].color, height: 26, fontSize: 13, padding: "0 10px" }}>P${t.p}</span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold truncate">${t.textRu || t.text}</span>
          <span class="block text-sm text-mute truncate">${t.facts.nick ? "На " + t.facts.nick + " · " : ""}${LANG[t.lang]} · ${t.human.length ? "решает админ" : "можно отправлять"}</span>
        </span>
      </button>`)}
    </div>
  </div>`;
}

function Goal({ title, value, total, done, onClick, hint }) {
  return html`<button type="button" onClick=${onClick} aria-pressed=${done} class="w-full min-h-[52px] text-left rounded-[2px] px-3 py-2 hover:bg-[var(--raised)]">
    <span class="flex items-center justify-between gap-2 text-[15px]">
      <span class=${"truncate " + (done ? "font-bold" : "")}>${title}</span>
      ${done ? html`<${Check} size=${18} class="flex-none" />` : html`<span class="num font-code text-xs text-mute flex-none">${hint}</span>`}
    </span>
    <span class="block mt-1"><${Bar} value=${value} total=${total} /></span>
  </button>`;
}

function Drawer({ s, activeId, goals, autoOpen, onAuto, onCheck, onPick, onClose }) {
  return html`<aside class="drawer enter fixed top-0 bottom-0 z-20 bg-[var(--paper)] border-r border-[var(--line)] overflow-y-auto p-5 grid gap-6 content-start">
    <div class="flex items-center justify-between">
      <h2 class="font-display text-lg font-bold">Очередь</h2>
      <button type="button" class="chip" onClick=${onClose}><${X} size=${16} /> Закрыть <span class="key">Q</span></button>
    </div>
    <div class="grid gap-1">
      ${s.tickets.map((t) => html`<button key=${t.id} type="button" class="row" aria-current=${t.id === activeId} onClick=${() => onPick(t.id)}>
        <span class="sticker" style=${{ background: P[t.p].color, width: 40, height: 40, fontSize: 13 }}>${initials(t.from)}</span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold truncate">${t.from}</span>
          <span class="block font-code text-xs text-mute truncate">${t.cat} ${LANG[t.lang]}</span>
        </span>
              </button>`)}
    </div>
    <div>

      </button>
      ${autoOpen && html`<ul class="px-3 pt-2 grid gap-4">
        ${AUTO.map((a) => {
          const done = s.autoChecked.includes(a.id);
          return html`<li key=${a.id} class="grid gap-1 text-[15px]">
            <p class="font-semibold">«${a.text}» <span class="font-code text-xs text-mute">${LANG[a.lang]}</span></p>

            <button type="button" disabled=${done} onClick=${() => onCheck(a.id)} class="chip justify-self-start mt-1">${done ? html`<${Check} size=${14} /> Проверено` : "Ответ верный"}</button>

function Translation({ text, stale }) {

/* Что сделал ИИ: одна строка из наклеек, последняя называет, кто решает. */

  return html`<div aria-label="Что сделал ИИ" class="flex flex-wrap gap-2">

    ${t.facts.nick && html`<span class="pill">На ${t.facts.nick}</span>`}
    <span class="pill">${t.facts.proof === "Нет" ? "Без доказательств" : t.facts.proof}</span>
    <span class="pill pill-final">${t.human.length ? "Решает админ" : "Можно отправлять"}</span>
  </div>`;
}

function Rule({ t, onChip, nudge, ruleOpen, onToggle }) {

  if (!rule) return null;
  let n = 0;
  return html`<section class="card">
    <div class="flex flex-wrap items-center gap-3">
      <h3 class="font-display text-[20px] font-bold">${t.ref}</h3>
      <span class="pill" style=${{ color: "var(--ok)" }}><${ShieldCheck} size=${16} /> Проверен по базе</span>
      <button type="button" class="chip ml-auto" onClick=${onToggle} aria-expanded=${ruleOpen}>${ruleOpen ? "Скрыть текст" : "Текст правила"} <span class="key">R</span></button>
    </div>
    ${ruleOpen && html`<div class="mt-3">
      <p class="text-[17px]">${rule.text}</p>
      ${rule.ladder.length > 0 && html`<ul class="mt-2 grid gap-1 text-[15px]">${rule.ladder.map((l, i) => html`<li key=${i}>${l}</li>`)}</ul>`}
    </div>`}
    ${t.chips && html`<div class=${"mt-5 grid gap-4" + (nudge ? " nudge" : "")} key=${nudge}>
      ${t.chips.map((g) => html`<div key=${g.group}>
        <p class="text-sm font-semibold mb-2">${g.group}</p>
        <div class="flex flex-wrap gap-2">${g.items.map((c) => { n += 1; const k = n; return html`<button key=${c.label} type="button" class="chip" aria-pressed=${t.chip === c.label} onClick=${() => onChip(c)}><span class="key">${k}</span>${c.label}</button>`; })}</div>

    </div>`}
  </section>`;
}

function Ticket({ t, editing, generating, onGenerate, seriesCount, nudge, ruleOpen, onToggleRule, onDraft, onEdit, onStopEdit, onSend, onEsc, onChip, onMerge, areaRef }) {
  const needsPunish = t.draft.includes(SLOT[t.lang]);
  useLayoutEffect(() => {
    const el = areaRef.current;
    if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  }, [t.draft, t.id]);
  return html`<div class="enter gutter ticket max-w-[880px] mx-auto py-8 grid gap-6 min-w-0" key=${t.id}>
    <div class="grid gap-3">
      <div class="flex flex-wrap items-center gap-3">
        <${Badge} p=${t.p} />
        <span class="text-sm text-mute"><span class="font-code">#${t.id}</span> · ${t.server}</span>
      </div>
      <h2 class="font-display text-[30px] font-bold leading-tight break-words">${t.from}</h2>
    </div>
    ${seriesCount > 0 && html`<div class="flex flex-wrap items-center gap-3 rounded-[2px] border border-[var(--line)] bg-[var(--paper)] px-5 py-3">
      <${Combine} size=${20} class="flex-none" />
      <p class="flex-1 min-w-[220px] font-semibold">На ${t.series} ещё ${seriesCount} ${seriesCount === 1 ? "жалоба" : "жалобы"} в очереди. Объединить?</p>
      <button type="button" class="chip" onClick=${onMerge}><span class="key">M</span>Объединить</button>
    </div>`}
    ${t.merged && html`<p class="flex items-center gap-2 text-[15px]"><${Combine} size=${18} class="flex-none" /> Объединено жалоб: ${t.merged.length + 1}.</p>`}
    <section class="card">
      <h3 class="label mb-2">Игрок написал</h3>
      <p class="text-[21px] leading-[1.5]">${t.text}</p>
      ${t.textRu && html`<${Translation} text=${t.textRu} />`}
      ${t.facts.proof !== "Нет" && html`<p class="mt-3 flex items-center gap-2 text-[15px] text-mute"><${Paperclip} size=${16} /> ${t.facts.proof}</p>`}
    </section>
    <${Trace} t=${t} />
    <${Profiles} t=${t} />
    <section class=${"card draft-card" + (editing ? " editing" : "")}>
      <label for="draft" class="label block mb-2">Черновик ответа, ${LANG[t.lang]}${editing ? " · Ctrl+Enter отправить, Esc выйти" : ""}</label>
      <textarea id="draft" ref=${areaRef} class="draft" rows="2" readOnly=${!editing} value=${t.draft} onChange=${(e) => onDraft(e.target.value)} onClick=${onEdit} onBlur=${onStopEdit}></textarea>
      ${t.draftRu && html`<${Translation} text=${t.draftRu} stale=${t.edited} />`}
      ${needsPunish && html`<p class="mt-3 inline-flex items-center gap-2 rounded-[2px] border border-[var(--line)] text-warnt px-4 py-2 text-[15px] font-semibold"><${TriangleAlert} size=${16} class="flex-none" /> Выберите наказание ниже или впишите своё</p>`}
    </section>
    <${Generate} t=${t} generating=${generating} onGenerate=${onGenerate} />
    <${Rule} t=${t} onChip=${onChip} nudge=${nudge} ruleOpen=${ruleOpen} onToggle=${onToggleRule} />
    ${t.human.length > 0 && html`<p class="flex gap-3 px-1">
      <${UserRound} size=${20} class="flex-none mt-[3px]" />
      <span class="min-w-0"><b>Нужен человек: </b><span class="text-mute">${t.human.join("; ")}.</span></span>
    </p>`}
    <div class="sticky bottom-0 py-3 flex flex-wrap gap-3 z-10 bg-sky">
      <button type="button" class="btn btn-main flex-1 min-w-[200px]" onClick=${onSend}><${Send} size=${20} /> Отправить <span class="key">Enter</span></button>
      <button type="button" class="btn" onClick=${onEdit}><${Pencil} size=${20} /> Править <span class="key">E</span></button>
      <button type="button" class="btn btn-danger" onClick=${onEsc}><${ArrowUpRight} size=${20} /> Эскалировать <span class="key">X</span></button>
    </div>
    <${Numbers} />

}

function Numbers() {
  const items = [["1,29 с", "p95 подготовки ответа", "var(--p3)"], ["$0,0004", "за обращение", "var(--ok)"], ["0", "выдуманных цитат", "var(--p1)"], ["RU KK UZ", "языки игроков", "var(--p2)"]];

function Cleared({ s, onUndo, canUndo }) {
  return html`<div class="enter gutter max-w-[880px] mx-auto py-12 grid gap-6 text-center justify-items-center">
    <h2 class="font-display text-4xl font-bold">Очередь закрыта</h2>
    <p class="text-mute text-lg">Отправлено ${s.sent}, передано администрации ${s.escalated}, автоматически ${AUTO_TOTAL}. Решения по наказаниям принимал админ.</p>
    ${canUndo && html`<button type="button" class="btn" onClick=${onUndo}><${Undo2} size=${20} /> Вернуть последний</button>`}
    <div class="w-full text-left"><${Numbers} /></div>
  </div>`;

function Toast({ toast, onUndo }) {
  return html`<div role="status" aria-live="polite" class="enter fixed z-30 bottom-6 left-1/2 -translate-x-1/2 bg-[var(--raised)] border border-[var(--line)] rounded-full pl-6 pr-2 py-2 flex items-center gap-3 max-w-[calc(100%-32px)]">
    <span class="font-semibold truncate">${toast.msg}</span>
    <span class="num font-code text-xs text-mute flex-none">${toast.left} с</span>
    <button type="button" class="chip flex-none" onClick=${onUndo}><${Undo2} size=${16} /> Отменить <span class="key">Z</span></button>
  </div>`;
}

function setChip(t, chip) {
  const slot = SLOT[t.lang], prev = t.chipData;
  const next = prev && prev.label === chip.label ? null : chip;
  const word = PUNISH_WORD[t.lang] || PUNISH_WORD.ru;
  const swap = (text, oldV, newV, label = word) => {
    if (text.includes(oldV)) return text.replace(oldV, newV);
    // Наказание ставим перед подписью, а не после неё.
    const sign = text.search(/\n+\s*(С уважением|Hurmat bilan|Құрметпен)/i);
    const line = `${label}: ${newV}.`;
    return sign > 0 ? `${text.slice(0, sign)} ${line}${text.slice(sign)}` : `${text} ${line}`;
  };
  const draft = swap(t.draft, prev ? prev.ins : slot, next ? next.ins : slot);
  const draftRu = t.draftRu ? swap(t.draftRu, prev ? prev.insRu : SLOT.ru, next ? next.insRu : SLOT.ru, PUNISH_WORD.ru) : t.draftRu;
  return { ...t, draft, draftRu, chip: next ? next.label : null, chipData: next };
}

function App() {
  const [s, setS] = useState({ tickets: TICKETS, sent: 0, escalated: 0, clean: 0, autoChecked: [], rulesRead: false });
  const [activeId, setActiveId] = useState(TICKETS[0] ? TICKETS[0].id : null);
  const [generating, setGenerating] = useState(null);
  const [groupOpen, setGroupOpen] = useState(null);
  const [drawer, setDrawer] = useState(false);
  const [autoOpen, setAutoOpen] = useState(false);
  const [ruleOpen, setRuleOpen] = useState(false);
  const [editing, setEditing] = useState(false);
  const [toast, setToast] = useState(null);
  const [nudge, setNudge] = useState(0);
  const areaRef = useRef(null);

  const active = s.tickets.find((t) => t.id === activeId) || null;
  const openP0 = s.tickets.filter((t) => t.p === 0).length;
  const seriesCount = active && active.series ? s.tickets.filter((t) => t.series === active.series && t.id !== active.id).length : 0;

  const goToP0 = () => { const b = s.tickets.find((t) => t.p === 0); if (b) { setActiveId(b.id); setDrawer(false); } };
  const goals = useMemo(() => {
    const closed = TOTAL_P0 - openP0;
    return [
      { id: "p0", title: "Закрыть все P0", value: closed, total: TOTAL_P0, done: openP0 === 0, hint: `${closed}/${TOTAL_P0}`, onClick: goToP0 },
      { id: "clean", title: "5 ответов без правок", value: Math.min(s.clean, 5), total: 5, done: s.clean >= 5, hint: `${Math.min(s.clean, 5)}/5`, onClick: () => {} },
      { id: "auto", title: "Проверить 3 автоответа", value: s.autoChecked.length, total: 3, done: s.autoChecked.length >= 3, hint: `${s.autoChecked.length}/3`, onClick: () => setAutoOpen(true) },
    ];
  }, [s, openP0]);

  const act = (msg, change) => {
    setToast({ msg, snap: { s, activeId }, left: 5, key: Date.now() });
    setS(change);
    setEditing(false);
  };
  const leave = (t, patch) => {
    const i = s.tickets.findIndex((x) => x.id === t.id);
    const rest = s.tickets.filter((x) => x.id !== t.id);
    // Следующим идёт обращение того же типа: так разбирают одинаковые подряд.
    const same = rest.find((x) => x.cat === t.cat);
    setActiveId(same ? same.id : rest.length ? rest[Math.min(i, rest.length - 1)].id : null);
    return { ...s, tickets: rest, ...patch };
  };

  const send = () => {
    if (!active) return;
    if (active.draft.includes(SLOT[active.lang])) { setNudge((n) => n + 1); return; }
    log(active, "send");
    const next = leave(active, { sent: s.sent + 1, clean: s.clean + (active.edited ? 0 : 1) });
    act("Отправлено", () => next);
  };
  const escalate = () => {
    if (!active) return;
    log(active, "escalate");
    const next = leave(active, { escalated: s.escalated + 1 });
    act("Передано администрации", () => next);
  };
  const merge = () => {
    if (!active || !active.series) return;
    const others = s.tickets.filter((t) => t.series === active.series && t.id !== active.id);
    if (!others.length) return;
    others.forEach((o) => log(o, "merge"));
    act(`Объединено жалоб: ${others.length + 1}`, (x) => ({
      ...x,
      tickets: x.tickets.filter((t) => !others.includes(t)).map((t) => (t.id === active.id ? { ...t, merged: others.map((o) => o.from), series: null } : t)),
    }));
  };
  const undo = () => {
    if (!toast) return;
    const back = toast.snap.s.tickets.find((x) => x.id === toast.snap.activeId);
    if (back) log(back, "undo");
    setS(toast.snap.s); setActiveId(toast.snap.activeId); setToast(null); setEditing(false);
  };
  const patchActive = (fn) => setS((x) => ({ ...x, tickets: x.tickets.map((t) => (t.id === activeId ? fn(t) : t)) }));
  const applyChip = (chip) => patchActive((t) => setChip(t, chip));
  const edit = () => { setEditing(true); setTimeout(() => areaRef.current && areaRef.current.focus(), 0); };
  const move = (delta) => {
    const i = s.tickets.findIndex((t) => t.id === activeId);
    const next = s.tickets[Math.max(0, Math.min(s.tickets.length - 1, i + delta))];
    if (next) setActiveId(next.id);
  };
  const checkAuto = (id) => {
    const a = AUTO.find((i) => i.id === id);
    if (a) log(a.ticket, "auto_ok");
    setS((x) => (x.autoChecked.includes(id) ? x : { ...x, autoChecked: [...x.autoChecked, id] }));
  };

  const patchTicket = (id, fn) => setS((x) => ({ ...x, tickets: x.tickets.map((t) => (t.id === id ? fn(t) : t)) }));

  const translate = (text) => postJson("/api/translate", { text }).then((r) => r.json()).then((d) => d.text).catch(() => null);

  const generate = async (verdict) => {
    if (!active || generating) return;
    const id = active.id, lang = active.lang;
    setGenerating(verdict);
    try {
      const r = await postJson("/api/generate/" + encodeURIComponent(id), { verdict }).then((x) => x.json());
      const offline = r.source !== "llm";
      patchTicket(id, (t) => ({ ...t, draft: r.draft_reply.text, draftRu: null, edited: false, chip: null, chipData: null, verdict,
        human: r.reasons, genNote: offline ? "ИИ недоступен: черновик собран из похожего случая." : "Черновик от ИИ, цитаты проверены. Можно править." }));
      if (lang === "kk" || lang === "uz") {
        const ru = await translate(r.draft_reply.text);
        if (ru) patchTicket(id, (t) => ({ ...t, draftRu: ru }));
      }
    } catch (e) {
      patchTicket(id, (t) => ({ ...t, genNote: "Не удалось сгенерировать, попробуйте ещё раз." }));
    } finally {
      setGenerating(null);
    }
  };

  /* Перевод для русскоязычных админов подгружается при открытии казахского или узбекского тикета. */
  useEffect(() => {
    if (!active || (active.lang !== "kk" && active.lang !== "uz") || active.textRu) return;
    const { id, text, draft } = active;
    translate(text).then((ru) => { if (ru) patchTicket(id, (t) => ({ ...t, textRu: ru })); });
    translate(draft).then((ru) => { if (ru) patchTicket(id, (t) => (t.draftRu ? t : { ...t, draftRu: ru })); });
  }, [activeId]);
  const pick = (id) => { setActiveId(id); setDrawer(false); setGroupOpen(null); };
  const group = groupOpen ? groupsOf(s.tickets).find((g) => g.cat === groupOpen) : null;

  useEffect(() => {
    if (!toast) return;
    if (toast.left <= 0) { setToast(null); return; }
    const id = setTimeout(() => setToast((t) => (t && t.key === toast.key ? { ...t, left: t.left - 1 } : t)), 1000);
    return () => clearTimeout(id);
  }, [toast]);

  useEffect(() => {
    setEditing(false);
    const main = document.querySelector(".main"); if (main) main.scrollTop = 0;
  }, [activeId]);

  const keys = useRef({});
  keys.current = { setGroupOpen, stopEdit: () => setEditing(false), send, escalate, merge, undo, edit, move, applyChip, active, setAutoOpen, setDrawer, setRuleOpen };
  useEffect(() => {
    const onKey = (e) => {
      const k = keys.current;
      const inField = e.target.tagName === "TEXTAREA" && !e.target.readOnly;
      if (inField) {
        if (e.code === "Escape") { e.preventDefault(); k.stopEdit(); e.target.blur(); }
        if (e.code === "Enter" && (e.ctrlKey || e.metaKey) && !e.repeat) { e.preventDefault(); k.send(); }
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      // Привязка к физической клавише: хоткеи работают и на русской раскладке.
      if (e.code === "Enter" || e.code === "NumpadEnter") {
        if (e.target.tagName !== "BUTTON" && !e.repeat) { e.preventDefault(); k.send(); }
      } else if (e.code === "ArrowDown") { e.preventDefault(); k.move(1); }
      else if (e.code === "ArrowUp") { e.preventDefault(); k.move(-1); }
      else if (e.code === "Escape") { k.setDrawer(false); k.setGroupOpen(null); }
      else if (e.repeat) return;
      else if (e.code === "KeyE") { e.preventDefault(); k.edit(); }
      else if (e.code === "KeyX") k.escalate();
      else if (e.code === "KeyZ") k.undo();
      else if (e.code === "KeyM") k.merge();
      else if (e.code === "KeyQ") k.setDrawer((o) => !o);
      else if (e.code === "KeyR") k.setRuleOpen((o) => !o);
      else if (e.code === "KeyA") { k.setDrawer(true); k.setAutoOpen((o) => !o); }
      else if (/^Digit[1-9]$/.test(e.code) && k.active && k.active.chips) {
        const chip = k.active.chips.flatMap((g) => g.items)[Number(e.code.slice(5)) - 1];
        if (chip) k.applyChip(chip);
      }
    };
    const onClick = (e) => { if (e.detail > 0 && document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur(); };
    document.addEventListener("keydown", onKey);
    document.addEventListener("click", onClick);
    return () => { document.removeEventListener("keydown", onKey); document.removeEventListener("click", onClick); };
  }, []);

  return html`<div class="app flex flex-col min-h-full">
    <${Header} s=${s} />
    <${Flow} />
    <div class="layout">
      <${Rail} s=${s} activeId=${activeId} openGroup=${groupOpen === TRY_VIEW ? TRY_VIEW : group ? group.cat : null} onGroup=${setGroupOpen} onMenu=${() => setDrawer(!drawer)} />
      <main class="main min-w-0">
        ${groupOpen === TRY_VIEW ? html`<${TryView} onBack=${() => setGroupOpen(null)} />` : group ? html`<${GroupView} g=${group} onPick=${pick} onBack=${() => setGroupOpen(null)} />` : active
          ? html`<${Ticket} t=${active} editing=${editing} generating=${generating} onGenerate=${generate} seriesCount=${seriesCount} nudge=${nudge} areaRef=${areaRef} ruleOpen=${ruleOpen} onToggleRule=${() => setRuleOpen(!ruleOpen)}
              onDraft=${(v) => patchActive((t) => ({ ...t, draft: v, edited: true }))} onEdit=${edit} onStopEdit=${() => setEditing(false)}
              onSend=${send} onEsc=${escalate} onChip=${applyChip} onMerge=${merge} />`
          : html`<${Cleared} s=${s} onUndo=${undo} canUndo=${!!toast} />`}
      </main>
    </div>
    ${drawer && html`<${Drawer} s=${s} activeId=${activeId} goals=${goals} autoOpen=${autoOpen} onAuto=${() => setAutoOpen(!autoOpen)} onCheck=${checkAuto} onPick=${pick} onClose=${() => setDrawer(false)} />`}
    ${toast && html`<${Toast} key=${toast.key} toast=${toast} onUndo=${undo} />`}
  </div>`;
}

loadQueue().then(() => ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`));
</script>

</body>
</html>
